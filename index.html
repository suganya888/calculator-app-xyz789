<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        .calculator {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 320px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            grid-template-areas:
                "display display display display"
                "clear divide multiply subtract"
                "seven eight nine plus"
                "four five six plus"
                "one two three equals"
                "zero zero decimal equals";
        }

        #calculator-display {
            grid-area: display;
            background-color: #222;
            color: #fff;
            font-size: 2.5em;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-height: 1.2em; /* Ensure consistent height */
            display: flex;
            align-items: center; /* Vertically center text */
            justify-content: flex-end; /* Right align text */
        }

        .calc-button {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            background-color: #e0e0e0;
            color: #333;
            outline: none;
        }

        .calc-button:hover {
            background-color: #d0d0d0;
            transform: scale(1.02);
        }

        .calc-button:active {
            transform: scale(0.98);
        }

        .calc-button.operator {
            background-color: #f39c12;
            color: #fff;
        }

        .calc-button.operator:hover {
            background-color: #e08e0b;
        }

        .calc-button.equals {
            background-color: #2ecc71;
            color: #fff;
        }

        .calc-button.equals:hover {
            background-color: #27ae60;
        }

        .calc-button.clear {
            background-color: #e74c3c;
            color: #fff;
        }

        .calc-button.clear:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div id="calculator-display">0</div>

        <button class="calc-button clear" style="grid-area: clear;">C</button>
        <button class="calc-button operator" style="grid-area: divide;">÷</button>
        <button class="calc-button operator" style="grid-area: multiply;">×</button>
        <button class="calc-button operator" style="grid-area: subtract;">-</button>

        <button class="calc-button" style="grid-area: seven;">7</button>
        <button class="calc-button" style="grid-area: eight;">8</button>
        <button class="calc-button" style="grid-area: nine;">9</button>
        <button class="calc-button operator" style="grid-area: plus;">+</button>

        <button class="calc-button" style="grid-area: four;">4</button>
        <button class="calc-button" style="grid-area: five;">5</button>
        <button class="calc-button" style="grid-area: six;">6</button>

        <button class="calc-button" style="grid-area: one;">1</button>
        <button class="calc-button" style="grid-area: two;">2</button>
        <button class="calc-button" style="grid-area: three;">3</button>
        <button class="calc-button equals" style="grid-area: equals;">=</button>

        <button class="calc-button" style="grid-area: zero;">0</button>
        <button class="calc-button decimal" style="grid-area: decimal;">.</button>
    </div>

    <script>
        const display = document.getElementById('calculator-display');
        const buttons = document.querySelectorAll('.calc-button');

        let displayValue = '0';
        let firstOperand = null;
        let operator = null;
        let waitingForSecondOperand = false;

        function updateDisplay() {
            display.textContent = displayValue;
        }

        function clearAll() {
            displayValue = '0';
            firstOperand = null;
            operator = null;
            waitingForSecondOperand = false;
            updateDisplay();
        }

        function inputDigit(digit) {
            if (displayValue === 'Error') { // Clear error state on new digit input
                displayValue = '0';
            }
            if (waitingForSecondOperand) {
                displayValue = digit;
                waitingForSecondOperand = false;
            } else {
                displayValue = displayValue === '0' ? digit : displayValue + digit;
            }
            updateDisplay();
        }

        function inputDecimal(dot) {
            if (displayValue === 'Error') { // Clear error state on decimal input
                displayValue = '0.';
                waitingForSecondOperand = false;
                updateDisplay();
                return;
            }
            if (waitingForSecondOperand) {
                displayValue = '0.';
                waitingForSecondOperand = false;
                updateDisplay();
                return;
            }

            if (!displayValue.includes(dot)) {
                displayValue += dot;
            }
            updateDisplay();
        }

        function handleOperator(nextOperator) {
            const inputValue = parseFloat(displayValue);

            if (displayValue === 'Error') { // Allow changing operator after an error without clearing
                operator = nextOperator;
                return;
            }

            if (operator && waitingForSecondOperand) {
                operator = nextOperator;
                return;
            }

            if (firstOperand === null) {
                firstOperand = inputValue;
            } else if (operator) {
                const result = performCalculation[operator](firstOperand, inputValue);

                if (result === 'Error') {
                    displayValue = 'Error';
                    firstOperand = null; // Reset state fully on error
                    operator = null;
                    waitingForSecondOperand = false;
                } else {
                    displayValue = String(result);
                    firstOperand = result;
                }
            }

            waitingForSecondOperand = true;
            operator = nextOperator;
            updateDisplay();
        }

        const performCalculation = {
            '÷': (firstOperand, secondOperand) => secondOperand === 0 ? 'Error' : firstOperand / secondOperand,
            '×': (firstOperand, secondOperand) => firstOperand * secondOperand,
            '+': (firstOperand, secondOperand) => firstOperand + secondOperand,
            '-': (firstOperand, secondOperand) => firstOperand - secondOperand
        };

        buttons.forEach(button => {
            button.addEventListener('click', (event) => {
                const { textContent } = event.target;

                if (event.target.classList.contains('clear')) {
                    clearAll();
                    return;
                }

                if (event.target.classList.contains('operator')) {
                    handleOperator(textContent);
                    return;
                }

                if (event.target.classList.contains('decimal')) {
                    inputDecimal('.');
                    return;
                }

                if (event.target.classList.contains('equals')) {
                    if (firstOperand === null || operator === null || displayValue === 'Error') {
                        return; // Nothing to calculate or already in error state
                    }

                    const inputValue = parseFloat(displayValue);
                    const result = performCalculation[operator](firstOperand, inputValue);

                    if (result === 'Error') {
                        displayValue = 'Error';
                    } else {
                        displayValue = String(result);
                    }
                    
                    firstOperand = null; // Reset for next calculation
                    operator = null;
                    waitingForSecondOperand = true; // Ready for new operation
                    updateDisplay();
                    return;
                }

                inputDigit(textContent);
            });
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
