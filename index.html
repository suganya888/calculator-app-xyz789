<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            user-select: none; /* Prevent text selection on calculator */
        }

        .calculator {
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 300px;
        }

        #display {
            background-color: #444;
            color: #fff;
            font-size: 2.5em;
            padding: 20px;
            text-align: right;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-height: 1.2em; /* Ensure display has a minimum height */
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .button {
            background-color: #666;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 20px 0;
            font-size: 1.5em;
            cursor: pointer;
            transition: background-color 0.2s ease;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button:hover {
            background-color: #888;
        }

        .button:active {
            background-color: #555;
        }

        .operator {
            background-color: #f09a36;
        }

        .operator:hover {
            background-color: #ffb15e;
        }

        .operator:active {
            background-color: #d17f22;
        }

        .clear {
            background-color: #d9534f;
        }

        .clear:hover {
            background-color: #e0706c;
        }

        .clear:active {
            background-color: #c0392b;
        }

        .calculate {
            background-color: #5cb85c;
        }

        .calculate:hover {
            background-color: #72c672;
        }

        .calculate:active {
            background-color: #4cae4c;
        }

        .span-two {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div id="display">0</div>
        <div class="calculator-grid">
            <button class="button clear" data-action="clear">C</button>
            <button class="button operator" data-action="sqrt">√</button>
            <button class="button operator" data-action="%">%</button>
            <button class="button operator" data-action="/">/</button>

            <button class="button number">7</button>
            <button class="button number">8</button>
            <button class="button number">9</button>
            <button class="button operator" data-action="*">*</button>

            <button class="button number">4</button>
            <button class="button number">5</button>
            <button class="button number">6</button>
            <button class="button operator" data-action="-">-</button>

            <button class="button number">1</button>
            <button class="button number">2</button>
            <button class="button number">3</button>
            <button class="button operator" data-action="+">+</button>

            <button class="button number span-two">0</button>
            <button class="button decimal">.</button>
            <button class="button calculate" data-action="calculate">=</button>
        </div>
    </div>

    <script>
        let displayValue = '0';
        let firstOperand = null;
        let waitingForSecondOperand = false;
        let operator = null;

        function updateDisplay() {
            const display = document.getElementById('display');
            display.textContent = displayValue;
        }

        function clearCalculator() {
            displayValue = '0';
            firstOperand = null;
            waitingForSecondOperand = false;
            operator = null;
            updateDisplay();
        }

        function inputDigit(digit) {
            if (displayValue === 'Error') {
                displayValue = '0'; // Clear error state on new digit input
            }
            if (waitingForSecondOperand === true) {
                displayValue = digit;
                waitingForSecondOperand = false;
            } else {
                displayValue = displayValue === '0' ? digit : displayValue + digit;
            }
            updateDisplay();
        }

        function inputDecimal(dot) {
            if (displayValue === 'Error') {
                displayValue = '0.';
                waitingForSecondOperand = false;
                updateDisplay();
                return;
            }
            if (waitingForSecondOperand === true) {
                displayValue = '0.';
                waitingForSecondOperand = false;
                updateDisplay();
                return;
            }
            if (!displayValue.includes(dot)) {
                displayValue += dot;
            }
            updateDisplay();
        }

        function handleOperator(nextOperator) {
            const inputValue = parseFloat(displayValue);

            if (isNaN(inputValue) && displayValue !== 'Error') {
                // If the display has an invalid number (e.g., just '.') and is not an error state.
                return;
            }

            if (nextOperator === 'sqrt') {
                if (inputValue < 0) {
                    displayValue = 'Error';
                    firstOperand = null;
                    operator = null;
                    waitingForSecondOperand = true;
                    updateDisplay();
                    return;
                }
                displayValue = String(Math.sqrt(inputValue));
                firstOperand = parseFloat(displayValue); // Result becomes the new firstOperand for potential chaining
                operator = null; // Unary ops don't set a pending binary op
                waitingForSecondOperand = true;
                updateDisplay();
                return;
            }

            if (nextOperator === '%') {
                displayValue = String(inputValue / 100);
                firstOperand = parseFloat(displayValue); // Result becomes the new firstOperand for potential chaining
                operator = null; // Unary ops don't set a pending binary op
                waitingForSecondOperand = true;
                updateDisplay();
                return;
            }

            if (operator && waitingForSecondOperand) {
                // If an operator was just pressed, and another operator is pressed, just update the operator
                operator = nextOperator;
                return;
            }

            if (firstOperand === null) {
                firstOperand = inputValue;
            } else if (operator) {
                const result = operate(firstOperand, inputValue, operator);
                if (result === 'Error') {
                    displayValue = 'Error';
                    firstOperand = null;
                    operator = null;
                    waitingForSecondOperand = true;
                    updateDisplay();
                    return;
                }
                displayValue = String(result);
                firstOperand = result;
            }

            waitingForSecondOperand = true;
            operator = nextOperator;
            updateDisplay();
        }

        function handleEquals() {
            if (firstOperand === null || operator === null) {
                // No operation pending or no first operand set
                return;
            }

            let secondOperand;
            if (waitingForSecondOperand) {
                // If an operator was just pressed (e.g., `5 + =`), the second operand is the first operand.
                secondOperand = firstOperand;
            } else {
                // A second number was entered (e.g., `5 + 3 =`).
                secondOperand = parseFloat(displayValue);
            }
            
            const result = operate(firstOperand, secondOperand, operator);

            if (result === 'Error') {
                displayValue = 'Error';
                firstOperand = null;
                operator = null;
                waitingForSecondOperand = true;
                updateDisplay();
                return;
            }

            displayValue = String(result);
            firstOperand = null; // Calculation is complete, reset for next operation
            operator = null;    // Calculation is complete, reset for next operation
            waitingForSecondOperand = true; // Next digit should start a new number
            updateDisplay();
        }

        function operate(firstNum, secondNum, op) {
            switch (op) {
                case '+':
                    return firstNum + secondNum;
                case '-':
                    return firstNum - secondNum;
                case '*':
                    return firstNum * secondNum;
                case '/':
                    if (secondNum === 0) {
                        return 'Error'; // Division by zero
                    }
                    return firstNum / secondNum;
                default:
                    return secondNum; // Should not be reached for valid ops
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDisplay();

            const calculatorGrid = document.querySelector('.calculator-grid');
            calculatorGrid.addEventListener('click', (event) => {
                const { target } = event;
                const action = target.dataset.action;

                if (!target.matches('button')) {
                    return;
                }

                if (target.classList.contains('number')) {
                    inputDigit(target.textContent);
                    return;
                }

                if (target.classList.contains('decimal')) {
                    inputDecimal(target.textContent);
                    return;
                }

                if (target.classList.contains('operator')) {
                    handleOperator(action);
                    return;
                }

                if (action === 'calculate') {
                    handleEquals();
                    return;
                }

                if (action === 'clear') {
                    clearCalculator();
                    return;
                }
            });
        });
    </script>
</body>
</html>
